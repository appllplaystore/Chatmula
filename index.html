Do you follow football or another sport?","Who is your favourite team or player?","What food would you order without even checking the menu?","Do you enjoy cooking or are you better at finding good places to eat? 😂"],"Charlie","Swahili beginner"],["Ethan Walsh","male","USA","4.6","bot_ethan_walsh.jpg",["Hey 👋 How's your day been?","What do you usually get up to when you're not working?","I like that. People always surprise me with what they enjoy.","Is there a place you've been wanting to visit for a while?","If you had a completely free weekend, what would you do?","What's one thing you've been thinking about lately?"],"Ethan","Swahili beginner"],["Liam Foster","male","UK","4.5","bot_liam_foster.jpg",["Hey there 😊 what's keeping you busy today?","Are you more of a morning person or a night owl?","I find that says a lot about someone.","What kind of music do you have on repeat lately?","If money weren't a concern, what would you spend your time doing?","What's something small that always cheers you up?"],"Liam","Swahili beginner"],["Noah Sinclair","male","Canada","4.8","bot_noah_sinclair.jpg",["Hey 😊 how's everything going?","What do you do when you need to recharge?","I feel like rest is underrated these days.","Do you prefer quiet nights in or going out with friends?","What's a hobby you've picked up recently?","What's something you're really proud of, even if it seems small?"],"Noah","Swahili beginner"],["Caleb Rhodes","male","USA","4.4","bot_caleb_rhodes.jpg",["Hey 👋 what's up?","Got any plans for the week?","Nice. I like hearing what people are into.","Do you follow any sports, or not really your thing?","What kind of food could you eat any day?","What's the best thing that happened to you this week?"],"Caleb","Swahili beginner"],["Mason Clarke","male","UK","4.7","bot_mason_clarke.jpg",["Hey 😊 how's your day treating you?","What's something you've been working on lately?","That sounds interesting. What's the hardest part?","Do you like being busy or do you prefer calmer days?","If you could learn one skill instantly, what would it be?","What's one thing you'd like to change about your routine?"],"Mason","Swahili beginner"],["Taylor Parker","female","UK","4.9","bot_taylor_parker.jpg",["Hi 😊 What kind of day are you having?","What usually makes you feel comfortable with someone new?","I think being able to laugh together helps a lot.","What is your favourite kind of conversation?","Would you rather spend a weekend near the ocean or somewhere quiet inland?","If you could travel anywhere tomorrow, where would you go?"],"Taylor","Swahili beginner"],["Riley Price","female","USA","4.6","bot_riley_price.jpg",["Hello 😊 How are things on your side today?","Are you a morning person or do you become more energetic at night?","What is the first thing you usually do when you get home?","What kind of food do you never get tired of?","Do you cook often or prefer someone else to handle the kitchen?","What Kenyan place would you happily visit again?"],"Riley","Swahili beginner"],["Casey Collins","female","Canada","4.7","bot_casey_collins.jpg",["Hey 😊 What has made you smile today?","What kind of things do you enjoy talking about with new people?","Are you more interested in music, movies, food, travel, or random stories?","What song have you played more than once recently?","Do you have a favourite place to relax?","What would your ideal Saturday look like?"],"Casey","Swahili beginner"],["Jamie Grant","female","UK","4.5","bot_jamie_grant.jpg",["Hey there 😊 What are you up to today?","What kind of personality do you normally click with?","Are you naturally talkative or quiet until you know someone?","What kind of music would you play on a road trip?","If you could take a road trip tomorrow, where would you go?","What snack would definitely come along for the ride? 😂"],"Jamie","Swahili beginner"],["Avery Hayes","female","USA","4.8","bot_avery_hayes.jpg",["Hey, how are you doing?","What is keeping you busy these days?","Do you enjoy your work ite way to spend a quiet evening?","Do you have a favourite place in the world?","What's one thing you'd like to be better at?"],"Mia","Swahili beginner"]];
function orderedBots(){
 const key='cm_bot_order_'+(state.uid||'guest');
 try{const saved=JSON.parse(localStorage.getItem(key)||'null');if(Array.isArray(saved)&&saved.length===bots.length){const byName=new Map(bots.map(b=>[b[0],b]));const ordered=saved.map(n=>byName.get(n)).filter(Boolean);if(ordered.length===bots.length)return ordered}}catch{}
 const ordered=bots.slice();for(let i=ordered.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ordered[i],ordered[j]]=[ordered[j],ordered[i]]}
 try{localStorage.setItem(key,JSON.stringify(ordered.map(b=>b[0])))}catch{}return ordered;
}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3200)}
function saveAuth(data){state.token=data.access_token||state.token;state.refresh=data.refresh_token||state.refresh;state.uid=data.user?.id||state.uid;const meta=data.user?.user_metadata||{};state.username=meta.username||state.username;state.email=data.user?.email||state.email;state.ref=meta.referral_code||state.ref;for(const [k,v] of Object.entries({cm_token:state.token,cm_refresh:state.refresh,cm_uid:state.uid,cm_username:state.username,cm_email:state.email,cm_ref:state.ref}))if(v)localStorage.setItem(k,v)}
function logout(){for(const k of ['cm_token','cm_refresh','cm_uid','cm_username','cm_email','cm_ref'])localStorage.removeItem(k);Object.assign(state,{token:'',refresh:'',uid:'',username:'',email:'',profile:null});renderAuth()}
async function req(path,{method='GET',body,token=state.token,prefer}={}){const headers={'Content-Type':'application/json','Accept':'application/json','apikey':KEY};if(token)headers.Authorization='Bearer '+token;else headers.Authorization='Bearer '+KEY;if(prefer)headers.Prefer=prefer;let res;try{res=await fetch(API+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)})}catch(e){throw new Error('Network error. Check your internet connection and try again.')}const text=await res.text();let data;try{data=text?JSON.parse(text):null}catch{data=text}if(!res.ok){if(res.status===401&&state.refresh&&path!=='/auth/v1/token?grant_type=refresh_token'){try{const fresh=await req('/auth/v1/token?grant_type=refresh_token',{method:'POST',token:KEY,body:{refresh_token:state.refresh}});saveAuth(fresh);return req(path,{method,body,token:state.token,prefer})}catch{}}throw new Error(data?.message||data?.msg||data?.error_description||data?.error||`Request failed (${res.status})`)}return data}
async function signIn(email,password){const d=await req('/auth/v1/token?grant_type=password',{method:'POST',token:KEY,body:{email,password}});saveAuth(d);try{await loadProfile()}catch(e){state.profile=null;console.warn('Profile could not be loaded; showing chatbot list anyway:',e)}renderHome();if(!state.profile)toast('You are signed in. Some account details could not load, but you can still view chatbots.')}
async function loadProfile(){if(!state.uid||!state.token)return null;const rows=await req('/rest/v1/profiles?id=eq.'+encodeURIComponent(state.uid)+'&select=*');state.profile=Array.isArray(rows)?rows[0]||null:null;return state.profile}
function fmt(n){return 'KSh '+Number(n||0).toLocaleString('en-KE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function shell(content,active='bots'){
 app.innerHTML=`<main class="wrap"><h1 class="chats-title">${active==='bots'||active==='bot'?'Chats':active==='chat'||active==='public'?'Public Chat':active==='wallet'?'Wallet':active==='invite'?'Invite':active==='account'?'Account':active==='activate'||active==='waiting'?'Activate your account':'Chats'}</h1>${content}</main><nav class="nav"><button data-page="chat" class="${active==='bots'||active==='bot'||active==='chat'||active==='public'?'active':''}"><b aria-hidden="true">▣</b><span>Chat</span></button><button data-page="wallet" class="${active==='wallet'?'active':''}"><b aria-hidden="true">▤</b><span>Wallet</span></button><button data-page="invite" class="${active==='invite'?'active':''}"><b aria-hidden="true">♧</b><span>Invite</span></button></nav>`;
 app.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>navigate(b.dataset.page));
}
function renderAuth(){state.page='auth';app.innerHTML=`<main class="auth"><div class="brand"><img src="icon.jpg" alt=""><span>ChatMula</span></div><section class="card"><h1 id="authTitle">Welcome back</h1><p class="muted" id="authDesc">Sign in to continue your conversations.</p><div id="authError" class="notice error hidden"></div><form id="authForm"><div id="signupFields" class="hidden"><div class="field"><label>Username</label><input id="username" autocomplete="username" minlength="3" maxlength="24" pattern="[A-Za-z0-9_]{3,24}"></div><div class="field"><label>M-Pesa phone number</label><input id="phone" inputmode="tel" placeholder="0712345678"></div><div class="field"><label>Referral code (optional)</label><input id="referral" value="${esc(state.ref)}" autocomplete="off"></div></div><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="email"></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password"></div><button class="btn full" id="authSubmit">Sign in</button></form><p class="foot"><span id="authSwitchText">New to ChatMula?</span> <a href="#" id="authSwitch" class="link">Create account</a></p></section><p class="foot">Install ChatMula from your browser menu for an app-like experience.</p></main>`;let mode='login';const fields=$('#signupFields');$('#authSwitch').onclick=e=>{e.preventDefault();mode=mode==='login'?'signup':'login';fields.classList.toggle('hidden',mode!=='signup');$('#authTitle').textContent=mode==='login'?'Welcome back':'Create your account';$('#authDesc').textContent=mode==='login'?'Sign in to continue your conversations.':'Join ChatMula and start connecting.';$('#authSubmit').textContent=mode==='login'?'Sign in':'Create account';$('#authSwitchText').textContent=mode==='login'?'New to ChatMula?':'Already have an account?';$('#authSwitch').textContent=mode==='login'?'Create account':'Sign in';$('#password').autocomplete=mode==='login'?'current-password':'new-password';};$('#authForm').onsubmit=async e=>{e.preventDefault();const btn=$('#authSubmit'),err=$('#authError');btn.disabled=true;err.classList.add('hidden');try{const email=$('#email').value.trim(),password=$('#password').value;if(mode==='login'){await signIn(email,password)}else{const username=$('#username').value.trim(),phone=normalizePhone($('#phone').value),referral=$('#referral').value.trim().toUpperCase();if(!/^[A-Za-z0-9_]{3,24}$/.test(username))throw Error('Username must be 3–24 characters using letters, numbers or _ only.');if(!phone)throw Error('Enter a valid M-Pesa number.');const d=await req('/functions/v1/signup',{method:'POST',token:KEY,body:{username,email,password,phone,...(referral?{referral}:{})}});if(d.access_token){saveAuth(d);try{await loadProfile()}catch(e){state.profile=null;console.warn('Profile could not be loaded; showing chatbot list anyway:',e)}renderHome();if(!state.profile)toast('Account created. Some account details could not load, but you can still view chatbots.')}else{toast(d.message||'Account request submitted. Please sign in when your account is ready.');mode='login';renderAuth()}}}catch(ex){err.textContent=ex.message;err.classList.remove('hidden')}finally{if($('#authSubmit'))$('#authSubmit').disabled=false}}}
function normalizePhone(raw){let p=String(raw||'').replace(/[\s()+-]/g,'');if(/^0[17]\d{8}$/.test(p))p='254'+p.slice(1);if(/^7\d{8}$/.test(p)||/^1\d{8}$/.test(p))p='254'+p;return /^254[17]\d{8}$/.test(p)?p:null}
async function navigate(page){if(!state.token){renderAuth();return}try{if(!state.profile)await loadProfile();if(page==='chat')renderBots();else if(page==='public')await renderPublicChat();else if(page==='bots')renderBots();else if(page==='wallet')await renderWallet();else if(page==='invite')await renderInvite();else if(page==='account')renderAccount();else if(page==='bot')renderBotChat();else if(page==='activate')renderActivation();else if(page==='waiting')renderWaiting(state.pendingId,state.pendingKind||'activation')}catch(e){toast(e.message)}}
async function renderHome(){return renderBots()}
async function renderPublicChat(){state.page='public';try{if(!state.profile)await loadProfile();const pp=state.profile||{},until=pp.chatbot_until?new Date(pp.chatbot_until):null;if(!pp.has_paid||(until&&until>Date.now())){toast(!pp.has_paid?'Activate your account to unlock public chat.':'Public chat unlocks after your pairing period.');renderHome();return}const rows=await req('/rest/v1/messages?select=*&order=created_at.asc');state.messages=Array.isArray(rows)?rows:[];shell(`<section class="card"><div class="row between"><div><h2>Public chat</h2><p class="muted small">Keep conversations respectful.</p></div><button class="btn secondary" id="refresh">Refresh</button></div><div class="messages" id="messages">${state.messages.map(m=>`<div class="bubble ${m.sender_id===state.uid?'mine':'theirs'}"><div class="meta">${esc(m.sender_username||'Member')} · ${esc(m.created_at?new Date(m.created_at).toLocaleString(): '')}</div>${esc(m.content||'')}${(m.sender_id===state.uid||state.profile?.is_admin)?`<div><button class="link" data-delete="${Number(m.id)}">Delete</button></div>`:''}</div>`).join('')||'<div class="empty">No messages yet. Start the conversation.</div>'}</div><form class="chatbox" id="sendForm"><input id="messageText" maxlength="2000" placeholder="Write a message…" autocomplete="off" required><button class="btn">Send</button></form></section>`,'chat');$('#refresh').onclick=()=>renderPublicChat();app.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this message?'))return;try{await req('/rest/v1/messages?id=eq.'+encodeURIComponent(b.dataset.delete),{method:'DELETE'});await renderPublicChat()}catch(e){toast(e.message)}});$('#sendForm').onsubmit=async e=>{e.preventDefault();const input=$('#messageText'),text=input.value.trim();if(!text)return;const btn=e.submitter;btn.disabled=true;try{await req('/rest/v1/messages',{method:'POST',body:{sender_id:state.uid,sender_username:state.username,content:text},prefer:'return=minimal'});input.value='';await renderPublicChat()}catch(ex){toast(ex.message)}finally{btn.disabled=false}};const box=$('#messages');box.scrollTop=box.scrollHeight}catch(e){shell(`<div class="notice error">${esc(e.message)}</div><button class="btn" id="back">Back</button>`);$('#back').onclick=()=>renderHome()}}
async function renderWallet(){state.page='wallet';if(!state.profile)await loadProfile();const p=state.profile||{};shell(`<section class="hero"><h1>Your wallet</h1><p>Track your earnings and request withdrawals.</p></section><section class="card"><p class="muted">Available balance</p><h1>${fmt(p.wallet_balance)}</h1><div class="grid2"><div class="stat"><strong>${fmt(p.total_earned)}</strong><span>Total earned</span></div><div class="stat"><strong>${fmt(p.total_withdrawn)}</strong><span>Total withdrawn</span></div></div></section><section class="card"><h2>Request withdrawal</h2><p class="muted small">Use the M-Pesa number registered for receiving funds. Withdrawal limits and fees are controlled by the server.</p><div id="walletError" class="notice error hidden"></div><form id="withdrawForm"><div class="field"><label>M-Pesa phone number</label><input id="withdrawPhone" inputmode="tel" placeholder="0712345678" required></div><div class="field"><label>Amount (KSh)</label><input id="withdrawAmount" type="number" min="100" max="${Math.max(0,Number(p.wallet_balance||0))}" step="1" required></div><p class="muted small" id="withdrawHint">Minimum withdrawal: KSh 100. Available: ${fmt(p.wallet_balance)}.</p><button class="btn full">Submit withdrawal request</button></form><button class="btn secondary full" id="walletRefresh" style="margin-top:8px">Refresh balance</button></section>`,'wallet');$('#walletRefresh').onclick=()=>renderWallet();$('#withdrawAmount').oninput=()=>{const a=Number($('#withdrawAmount').value||0),bal=Number(p.wallet_balance||0),h=$('#withdrawHint');if(h)h.textContent=bal<100?'Withdrawals start at KSh 100. Your available balance is '+fmt(bal)+'.':a<100?'Minimum withdrawal is KSh 100.':a>bal?'Insufficient balance. You have '+fmt(bal)+' available.':'You can withdraw this amount.'};$('#withdrawForm').onsubmit=async e=>{e.preventDefault();const phone=normalizePhone($('#withdrawPhone').value),amount=Number($('#withdrawAmount').value),btn=e.submitter,err=$('#walletError');err.classList.add('hidden');if(!phone){err.textContent='Enter a valid M-Pesa phone number.';err.classList.remove('hidden');return}if(!Number.isFinite(amount)||amount<100){err.textContent='Minimum withdrawal is KSh 100.';err.classList.remove('hidden');return}const available=Number(state.profile?.wallet_balance||0);if(available<100){err.textContent='Your available balance is below the KSh 100 minimum withdrawal.';err.classList.remove('hidden');return}if(amount>available){err.textContent='Insufficient wallet balance. Available: '+fmt(available)+'.';err.classList.remove('hidden');return}btn.disabled=true;try{const result=await req('/functions/v1/withdraw',{method:'POST',body:{phone,amount}});toast(result.message||'Withdrawal request submitted.');await renderWallet()}catch(ex){err.textContent=ex.message;err.classList.remove('hidden')}finally{btn.disabled=false}}}
async function renderInvite(){if(!state.profile)await loadProfile();const p=state.profile||{};if(!p.has_paid){toast('Activate your account to unlock referrals.');renderHome();return}state.page='invite';let settings=[];try{settings=await req('/rest/v1/site_settings?select=*&id=eq.main', {token:KEY})}catch{}const base=(settings?.[0]?.website_url||'https://chatmula.co.ke').replace(/\/$/,'');const code=p.referral_code||state.ref||'';const link=code?`${base}/?ref=${encodeURIComponent(code)}`:'';shell(`<section class="hero"><h1>Invite your people</h1><p>Share your referral link and invite friends to join ChatMula.</p></section><section class="card"><h2>Your referral code</h2><div class="stat"><strong>${esc(code||'Not available')}</strong><span>Share this code with friends</span></div><div class="field"><label>Your referral link</label><input id="refLink" readonly value="${esc(link)}"></div><div class="grid2"><button class="btn" id="copyLink">Copy link</button><button class="btn secondary" id="shareLink">Share link</button></div><p class="muted small">Referral eligibility and rewards are calculated by the existing backend.</p></section>`,'invite');$('#copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Referral link copied.')}catch{ $('#refLink').select();document.execCommand('copy');toast('Referral link copied.')}};$('#shareLink').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Join ChatMula',text:'Join me on ChatMula!',url:link})}catch{}}else{try{await navigator.clipboard.writeText(link);toast('Link copied.')}catch{toast(link)}}}}
function renderAccount(){state.page='account';const p=state.profile||{};shell(`<section class="hero"><h1>Account</h1><p>Manage your ChatMula session.</p></section><section class="card"><div class="row"><div class="avatar" style="display:grid;place-items:center;font-size:24px">👤</div><div class="item-main"><strong>${esc(state.username||'ChatMula member')}</strong><p>${esc(state.email)}</p></div></div><div class="divider"></div><div class="row between"><span class="muted">Activation</span><strong>${p.has_paid?'Active':'Not active'}</strong></div><div class="row between" style="margin-top:12px"><span class="muted">Account role</span><strong>${p.is_admin?'Administrator':'Member'}</strong></div><div class="row between" style="margin-top:12px"><span class="muted">Referral code</span><strong>${esc(p.referral_code||'—')}</strong></div><div class="divider"></div>${!p.has_paid?'<button class="btn full" id="accountActivate">Activate account</button>':''}<button class="btn danger full" id="logout" style="margin-top:8px">Sign out</button></section><p class="muted small">This PWA uses your existing ChatMula account and Supabase backend. Browser push notifications are not included.</p>`,'account');$('#logout').onclick=logout;if($('#accountActivate'))$('#accountActivate').onclick=()=>navigate('activate')}

window.addEventListener('error',function(e){console.error('ChatMula UI error',e.error||e.message);if(app&&!app.querySelector('.fatal-error')){const d=document.createElement('div');d.className='notice error fatal-error';d.style.margin='16px';d.textContent='ChatMula could not display this screen: '+(e.message||'unknown error')+'. Reload the page or contact support if it continues.';app.appendChild(d)}});
function botStoreKey(){return 'cm_bot_state_'+(state.uid||'guest')}
function readBotState(){try{return JSON.parse(localStorage.getItem(botStoreKey())||'{}')}catch{return {}}}
function writeBotState(v){localStorage.setItem(botStoreKey(),JSON.stringify(v))}
function botHistoryKey(bot){return 'cm_bot_'+state.uid+'_'+String(bot[6]||bot[0]).toLowerCase()}
function hasRepliedToAnyBot(){return orderedBots().some(b=>{try{return JSON.parse(localStorage.getItem(botHistoryKey(b))||'[]').some(m=>m.mine)}catch{return false}})}
function botIsEnded(bot){const s=readBotState();return !!(s.ended&&s.ended[String(bot[6]||bot[0]).toLowerCase()])}
function renderBots(){
 const bs=readBotState(),booked=bs.bookedName,bookedAt=Number(bs.bookedAt||0),remaining=Math.max(0,30000-(Date.now()-bookedAt));state.page='bots';
 const order=orderedBots();
 const rows=[];
 if(state.profile?.has_paid){rows.push(`<div class="item" role="button" tabindex="0" id="publicChatRow"><img class="avatar" src="icon.jpg" alt="Chat"><div class="item-main"><strong>Public Chat</strong><p class="preview">💬 Chat while we locate your match</p><p class="level">Available after activation</p></div><button class="book-btn" id="openPublicChat">Open</button></div>`)}
 // Match Android MessagesActivity: move an ended/replied bot to the first row, then keep the user's saved order.
 let hoist=order.find(b=>botIsEnded(b));if(!hoist)hoist=order.find(b=>{try{return JSON.parse(localStorage.getItem(botHistoryKey(b))||'[]').some(m=>m.mine)}catch{return false}});
 const list=hoist?[hoist,...order.filter(b=>b!==hoist)]:order;
 for(const b of list){
   const key=String(b[6]||b[0]).toLowerCase();let history=[];try{history=JSON.parse(localStorage.getItem(botHistoryKey(b))||'[]')}catch{}
   const replied=history.some(m=>m.mine),ended=botIsEnded(b),visual=(bs.visual||[]).includes(key),isBooked=booked===b[0],wait=isBooked&&remaining>0;
   const label=ended?'Reopen':replied?'Open':wait?`${Math.ceil(remaining/1000)}s`:visual?'Booked':'Book';
   const preview=history.length?(history[history.length-1].text||''):(b[5]?.[0]||'Start a conversation');
   rows.push(`<div class="item"><img class="avatar" src="${esc(b[4])}" alt="${esc(b[0])}" loading="lazy" onerror="this.onerror=null;this.src='icon.jpg';this.alt='ChatMula'"><div class="item-main"><strong>${esc(b[0])}</strong><p>⭐ ${esc(b[3])} · ${esc(b[7]||'Swahili beginner')}</p><p class="level">${esc(b[2])}</p><p class="preview">${esc(preview)}</p></div><button class="book-btn ${wait||visual?'booked':''}" data-bot="${esc(b[0])}">${label}</button></div>`);
 }
 shell(`<section class="chat-list">${rows.join('')}</section>`,'bots');
 const publicBtn=$('#openPublicChat');if(publicBtn)publicBtn.onclick=()=>navigate('public');const publicRow=$('#publicChatRow');if(publicRow)publicRow.onclick=e=>{if(e.target.id!=='openPublicChat')navigate('public')};
 app.querySelectorAll('[data-bot]').forEach(btn=>btn.onclick=()=>handleBotTap(bots.find(b=>b[0]===btn.dataset.bot)));
 if(remaining>0){clearTimeout(state.botReplyTimer);state.botReplyTimer=setTimeout(()=>{if(state.page==='bots')renderBots()},1000)}
}
function handleBotTap(bot){
 const key=String(bot[6]||bot[0]).toLowerCase(),bs=readBotState();let hist=[];try{hist=JSON.parse(localStorage.getItem(botHistoryKey(bot))||'[]')}catch{}
 const ended=botIsEnded(bot),replied=hist.some(m=>m.mine);
 if(ended){if(!state.profile?.has_paid){toast('Activate your account to reopen ended conversations.');return}openBot(bot);return}
 if(replied){openBot(bot);return}
 if(bs.bookedName===bot[0]){const rem=Math.max(0,30000-(Date.now()-Number(bs.bookedAt||0)));if(rem>0){toast('Booking in progress — '+Math.ceil(rem/1000)+'s');renderBots();return}openBot(bot);return}
 if(!hasRepliedToAnyBot()){
   if(!bs.bookedName||Date.now()-Number(bs.bookedAt||0)>=30000){bs.bookedName=bot[0];bs.bookedAt=Date.now();writeBotState(bs);toast((bot[6]||bot[0].split(' ')[0])+' is joining... 30s');renderBots()}
   else toast('A chatbot booking is already in progress.');return;
 }
 if(!navigator.onLine){toast('Internet connection required to book another chatbot.');return}
 if(!state.profile?.has_paid){toast('Activate your account to book another chatbot.');return}
 bs.visual=Array.isArray(bs.visual)?bs.visual:[];if(bs.visual.includes(key)){toast((bot[6]||bot[0])+' will reach out soon');return}bs.visual.push(key);writeBotState(bs);toast('Booked — '+(bot[6]||bot[0])+' will reach out');renderBots();
}
function openBot(bot){state.bot=bot;try{state.botHistory=JSON.parse(localStorage.getItem(botHistoryKey(bot))||'[]')}catch{state.botHistory=[]}state.botTyping=false;renderBotChat();if(!state.botHistory.length){state.botTyping=true;renderBotChat();const delay=2500+Math.floor(Math.random()*1500);clearTimeout(state.botReplyTimer);state.botReplyTimer=setTimeout(()=>{if(state.page!=='bot')return;state.botTyping=false;state.botHistory.push({mine:false,text:'Hey 👋'});saveBotHistory();renderBotChat()},delay)}}
function saveBotHistory(){if(state.bot&&state.uid)localStorage.setItem(botHistoryKey(state.bot),JSON.stringify(state.botHistory||[]))}
function renderBotChat(){
 if(!state.bot){renderBots();return}state.page='bot';const bot=state.bot,history=state.botHistory||[],ended=botIsEnded(bot);
 shell(`<section class="card"><div class="row"><img class="avatar" src="./${bot[4]}" alt="${esc(bot[0])}" onerror="this.onerror=null;this.src='./icon.jpg';this.alt='ChatMula bot'"><div class="item-main"><strong>${esc(bot[0])}</strong><p>⭐ ${bot[3]} · ${esc(bot[2])} · ${esc(bot[7]||'Swahili beginner')}</p></div><button class="btn secondary" id="backBots">Back</button></div><div class="messages" id="botMessages">${history.map(m=>`<div class="bubble ${m.mine?'mine':'theirs'}">${esc(m.text)}</div>`).join('')}${state.botTyping?`<div class="typing" id="botTyping">${esc(bot[6]||bot[0].split(' ')[0])} is typing…</div>`:''}</div>${ended?`<div class="notice">Wait for ${esc(bot[6]||bot[0].split(' ')[0])} to resume chat.</div>`:''}<form class="chatbox" id="botForm"><input id="botText" maxlength="1200" placeholder="${ended?'Conversation paused':'Message '+esc(bot[6]||bot[0].split(' ')[0])+'…'}" ${ended||state.botTyping?'disabled':''} required><button class="btn" ${ended||state.botTyping?'disabled':''}>Send</button></form></section>`,'bots');
 $('#backBots').onclick=()=>{clearTimeout(state.botReplyTimer);state.botTyping=false;renderBots()};const box=$('#botMessages');box.scrollTop=box.scrollHeight;
 $('#botForm').onsubmit=e=>{
  e.preventDefault();const input=$('#botText'),text=input.value.trim();if(!text||state.botTyping||botIsEnded(bot))return;
  state.botHistory.push({mine:true,text});saveBotHistory();const turns=state.botHistory.filter(m=>m.mine).length;
  state.botTyping=true;renderBotChat();const reply=botReplyFor(turns,bot[6]||bot[0].split(' ')[0]);
  const base=turns===1?6000:turns===2?8000:turns===3?9000:turns===4?8000:3500;
  const spread=turns===1?4000:turns===2||turns===3?4500:turns===4?4000:1500;
  const delay=base+Math.floor(Math.random()*(spread+1))+Math.min(2500,text.length*25);
  state.botReplyTimer=setTimeout(()=>{if(state.page!=='bot'||!state.bot)return;state.botTyping=false;state.botHistory.push({mine:false,text:reply});if(turns>=5){const bs=readBotState();bs.ended=bs.ended||{};bs.ended[String(bot[6]||bot[0]).toLowerCase()]=true;writeBotState(bs)}saveBotHistory();renderBotChat()},delay);
 };
}
function botReplyFor(turn,name){
 if(turn>=5){const waves=['👋 Later!','👋 See you later!','Alright, later 😊 👋','👋 Talk later!'];return waves[Math.floor(Math.random()*waves.length)]}
 if(turn===4){const byes=["Sorry, I have to step away for a bit — I'm working on a project 😊 I'll be back soon, okay?","I'm in the middle of a project right now 😅 I'll be back soon. Don't go too far!","Something came up with a project I'm working on. I'll be back soon 😊 Talk in a bit!"];return byes[Math.floor(Math.random()*byes.length)]}
 if(turn===1){const intros=[`I'm ${name} 😊 I want to learn Swahili and I'd like you to be my Swahili teacher. Can you help me?`,`I'm ${name} 😊 I've been wanting to learn Swahili properly, and I'd love for you to be my teacher. Would you?`,`I'm ${name} 😊 I'm looking for someone to teach me Swahili. I'd like that person to be you — if you don't mind.`];return intros[Math.floor(Math.random()*intros.length)]}
 const pool=["So where should we start? What's the first thing you'd teach me?","Is 'jambo' too formal for everyday use, or is it fine?","What's a Swahili phrase that would actually impress someone?","What mistakes do learners usually make that I should avoid?","How do I pronounce Swahili words naturally without sounding like a textbook?","What's a Swahili phrase people actually use every day, not just in lessons?","Is there a Swahili phrase that always makes people smile?","What's one thing about Swahili that surprises most learners?"];
 // Stable per-bot shuffle, then select the same turn position as the Android script.
 let seed=0;for(const ch of String(name))seed=(seed*31+ch.charCodeAt(0))|0;const shuffled=pool.slice();for(let i=shuffled.length-1;i>0;i--){seed=(Math.imul(seed,1664525)+1013904223)|0;const j=(seed>>>0)%(i+1);[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}return shuffled[Math.max(0,Math.min(shuffled.length-1,turn-2) )];
}
async function renderActivation(){state.page='activate';let settings=[];try{settings=await req('/rest/v1/site_settings?select=*&id=eq.main',{token:KEY})}catch{}const fee=Number(settings?.[0]?.activation_fee||100);shell(`<section class="hero"><h1>Activate ChatMula</h1><p>Complete your one-time M-Pesa activation to unlock chat and earnings.</p></section><section class="card"><div class="stat"><strong>${fmt(fee)}</strong><span>Activation fee</span></div><div class="notice">Enter the M-Pesa number that should receive the STK Push prompt. Keep this page open while payment is verified.</div><div id="activationError" class="notice error hidden"></div><form id="activationForm"><div class="field"><label>M-Pesa phone number</label><input id="activationPhone" inputmode="tel" placeholder="0712345678" required></div><button class="btn full">Pay with M-Pesa</button></form><button class="btn secondary full" id="activationBack" style="margin-top:8px">Back to bots</button></section>`,'chat');$('#activationBack').onclick=()=>renderHome();$('#activationForm').onsubmit=async e=>{e.preventDefault();const phone=normalizePhone($('#activationPhone').value),btn=e.submitter,err=$('#activationError');if(!phone){err.textContent='Enter a valid M-Pesa number.';err.classList.remove('hidden');return}btn.disabled=true;err.classList.add('hidden');try{const d=await req('/functions/v1/activate',{method:'POST',body:{phone}});if(d.alreadyActivated){await loadProfile();toast('Your account is already activated.');renderHome();return}if(!d.pendingId)throw Error(d.message||d.error||'The server did not return a payment reference.');state.pendingId=d.pendingId;state.pendingKind='activation';renderWaiting(d.pendingId,'activation')}catch(ex){err.textContent=ex.message;err.classList.remove('hidden')}finally{btn.disabled=false}}}
function renderWaiting(id,kind){state.page='waiting';shell(`<section class="hero"><h1>Verifying payment</h1><p>Complete the M-Pesa prompt on your phone. This page will check the payment status.</p></section><section class="card"><div class="notice">Keep this page open. Verification runs every 5 seconds.</div><div id="waitingStatus" class="notice">Waiting for payment confirmation…</div><button class="btn secondary full" id="checkNow">Check status now</button><button class="btn ghost full" id="cancelWait" style="margin-top:8px">Return to bots</button></section>`,'chat');$('#cancelWait').onclick=()=>{clearTimeout(state.pollTimer);renderHome()};const check=async()=>{try{const path=kind==='activation'?'/functions/v1/check-activation?id=':'/functions/v1/check-signup?id=';const d=await req(path+encodeURIComponent(id),{token:KEY});const status=String(d.status||'').toUpperCase();if(status==='COMPLETED'){clearTimeout(state.pollTimer);$('#waitingStatus').className='notice success';$('#waitingStatus').textContent='Payment confirmed. Updating your account…';await loadProfile();toast('Payment confirmed.');renderHome();return}if(status==='FAILED'){clearTimeout(state.pollTimer);$('#waitingStatus').className='notice error';$('#waitingStatus').textContent='Payment was not completed. Return to activation and try again.';return}$('#waitingStatus').textContent='Status: '+(status||'PENDING')+'. Waiting for confirmation…'}catch(ex){$('#waitingStatus').textContent=ex.message}state.pollTimer=setTimeout(check,5000)};$('#checkNow').onclick=()=>{clearTimeout(state.pollTimer);check()};check()}
async function boot(){if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(e=>console.warn('Service worker unavailable:',e));if(new URLSearchParams(location.search).get('ref')){state.ref=new URLSearchParams(location.search).get('ref').trim().toUpperCase();localStorage.setItem('cm_ref',state.ref)}if(state.token&&state.uid){try{await loadProfile()}catch(e){state.profile=null;console.warn('Profile refresh failed; keeping signed-in session:',e)}renderHome();if(!state.profile)toast('Chatbots are shown, but account details could not load.');return}renderAuth()}
// GitHub Pages project URLs sometimes open without the final slash. In that case,
// relative root-level bot images resolve outside the repository. Normalize first.
const lastPathPart=location.pathname.split('/').pop();
if(location.protocol.startsWith('http') && location.pathname!=='/' && !location.pathname.endsWith('/') && !lastPathPart.includes('.')) {
  location.replace(location.pathname+'/'+location.search+location.hash);
} else {
  boot();
}

</script>
