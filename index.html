async function renderWallet(){state.page='wallet';if(!state.profile)await loadProfile();const p=state.profile||{};shell(`<section class="hero"><h1>Your wallet</h1><p>Track your earnings and request withdrawals.</p></section><section class="card"><p class="muted">Available balance</p><h1>${fmt(p.wallet_balance)}</h1><div class="grid2"><div class="stat"><strong>${fmt(p.total_earned)}</strong><span>Total earned</span></div><div class="stat"><strong>${fmt(p.total_withdrawn)}</strong><span>Total withdrawn</span></div></div></section><section class="card"><h2>Request withdrawal</h2><p class="muted small">Use the M-Pesa number registered for receiving funds. Withdrawal limits and fees are controlled by the server.</p><div id="walletError" class="notice error hidden"></div><form id="withdrawForm"><div class="field"><label>M-Pesa phone number</label><input id="withdrawPhone" inputmode="tel" placeholder="0712345678" required></div><div class="field"><label>Amount (KSh)</label><input id="withdrawAmount" type="number" min="1" step="1" required></div><button class="btn full">Submit withdrawal request</button></form><button class="btn secondary full" id="walletRefresh" style="margin-top:8px">Refresh balance</button></section>`,'wallet');$('#walletRefresh').onclick=()=>renderWallet();$('#withdrawForm').onsubmit=async e=>{e.preventDefault();const phone=normalizePhone($('#withdrawPhone').value),amount=Number($('#withdrawAmount').value),btn=e.submitter,err=$('#walletError');err.classList.add('hidden');if(!phone){err.textContent='Enter a valid M-Pesa phone number.';err.classList.remove('hidden');return}if(!Number.isFinite(amount)||amount<=0){err.textContent='Enter a valid withdrawal amount.';err.classList.remove('hidden');return}btn.disabled=true;try{const result=await req('/functions/v1/withdraw',{method:'POST',body:{phone,amount}});toast(result.message||'Withdrawal request submitted.');await renderWallet()}catch(ex){err.textContent=ex.message;err.classList.remove('hidden')}finally{btn.disabled=false}}}
async function renderInvite(){state.page='invite';if(!state.profile)await loadProfile();const p=state.profile||{};let settings=[];try{settings=await req('/rest/v1/site_settings?select=*&id=eq.main', {token:KEY})}catch{}const base=(settings?.[0]?.website_url||location.origin).replace(/\/$/,'');const code=p.referral_code||state.ref||'';const link=code?`${base}/?ref=${encodeURIComponent(code)}`:'';shell(`<section class="hero"><h1>Invite your people</h1><p>Share your referral link and invite friends to join ChatMula.</p></section><section class="card"><h2>Your referral code</h2><div class="stat"><strong>${esc(code||'Not available')}</strong><span>Share this code with friends</span></div><div class="field"><label>Your referral link</label><input id="refLink" readonly value="${esc(link)}"></div><div class="grid2"><button class="btn" id="copyLink">Copy link</button><button class="btn secondary" id="shareLink">Share link</button></div><p class="muted small">Referral eligibility and rewards are calculated by the existing backend.</p></section>`,'invite');$('#copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(link);toast('Referral link copied.')}catch{ $('#refLink').select();document.execCommand('copy');toast('Referral link copied.')}};$('#shareLink').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Join ChatMula',text:'Join me on ChatMula!',url:link})}catch{}}else{try{await navigator.clipboard.writeText(link);toast('Link copied.')}catch{toast(link)}}}}
function renderAccount(){state.page='account';const p=state.profile||{};shell(`<section class="hero"><h1>Account</h1><p>Manage your ChatMula session.</p></section><section class="card"><div class="row"><div class="avatar" style="display:grid;place-items:center;font-size:24px">ðŸ‘¤</div><div class="item-main"><strong>${esc(state.username||'ChatMula member')}</strong><p>${esc(state.email)}</p></div></div><div class="divider"></div><div class="row between"><span class="muted">Activation</span><strong>${p.has_paid?'Active':'Not active'}</strong></div><div class="row between" style="margin-top:12px"><span class="muted">Account role</span><strong>${p.is_admin?'Administrator':'Member'}</strong></div><div class="row between" style="margin-top:12px"><span class="muted">Referral code</span><strong>${esc(p.referral_code||'â€”')}</strong></div><div class="divider"></div>${!p.has_paid?'<button class="btn full" id="accountActivate">Activate account</button>':''}<button class="btn danger full" id="logout" style="margin-top:8px">Sign out</button></section><p class="muted small">This PWA uses your existing ChatMula account and Supabase backend. Browser push notifications are not included.</p>`,'account');$('#logout').onclick=logout;if($('#accountActivate'))$('#accountActivate').onclick=()=>navigate('activate')}
function renderBots(){const p=state.profile||{},until=p.chatbot_until?new Date(p.chatbot_until):null;if(!p.has_paid||!until||until<=Date.now()){toast('Chatbots are available during your pairing period after activation.');renderHome();return}state.page='bots';shell(`<section class="hero"><h1>Meet the chatbots</h1><p>Start a conversation while waiting to be paired.</p></section><section class="card"><p class="muted small">These are in-app scripted conversations from the Android version. They are not live human users.</p><div class="list">${bots.map((b,i)=>`<div class="item"><img class="avatar" src="${b[4]}" alt="${esc(b[0])}" loading="lazy"><div class="item-main"><strong>${esc(b[0])}</strong><p>â­ ${b[3]} Â· ${esc(b[2])} Â· Swahili beginner</p></div><button class="btn secondary" data-bot="${i}">Chat</button></div>`).join('')}</div></section>`,'chat');app.querySelectorAll('[data-bot]').forEach(b=>b.onclick=()=>{state.bot=bots[Number(b.dataset.bot)];state.botHistory=JSON.parse(localStorage.getItem('cm_bot_'+state.uid+'_'+state.bot[0])||'[]');if(!state.botHistory.length)state.botHistory.push({mine:false,text:`Hey ðŸ‘‹ I'm ${state.bot[0].split(' ')[0]}. ${state.bot[5][0]}`});renderBotChat()})}
function renderBotChat(){if(!state.bot){renderBots();return}state.page='bot';const bot=state.bot;const history=state.botHistory||[];shell(`<section class="card"><div class="row"><img class="avatar" src="${bot[4]}" alt=""><div class="item-main"><strong>${esc(bot[0])}</strong><p>â­ ${bot[3]} Â· ${esc(bot[2])}</p></div><button class="btn secondary" id="backBots">Back</button></div><div class="messages" id="botMessages">${history.map(m=>`<div class="bubble ${m.mine?'mine':'theirs'}">${esc(m.text)}</div>`).join('')}</div><form class="chatbox" id="botForm"><input id="botText" maxlength="1200" placeholder="Message ${esc(bot[0].split(' ')[0])}â€¦" required><button class="btn">Send</button></form></section>`,'chat');$('#backBots').onclick=()=>renderBots();const box=$('#botMessages');box.scrollTop=box.scrollHeight;$('#botForm').onsubmit=e=>{e.preventDefault();const input=$('#botText'),text=input.value.trim();if(!text)return;state.botHistory.push({mine:true,text});input.value='';const turns=state.botHistory.filter(m=>m.mine).length,reply=bot[5][Math.min(turns,bot[5].length-1)]||'That is interesting ðŸ˜Š Tell me a little more about that.';setTimeout(()=>{state.botHistory.push({mine:false,text:reply});localStorage.setItem('cm_bot_'+state.uid+'_'+bot[0],JSON.stringify(state.botHistory));renderBotChat()},700);localStorage.setItem('cm_bot_'+state.uid+'_'+bot[0],JSON.stringify(state.botHistory));renderBotChat()}}
async function renderActivation(){state.page='activate';let settings=[];try{settings=await req('/rest/v1/site_settings?select=*&id=eq.main',{token:KEY})}catch{}const fee=Number(settings?.[0]?.activation_fee||100);shell(`<section class="hero"><h1>Activate ChatMula</h1><p>Complete your one-time M-Pesa activation to unlock chat and earnings.</p></section><section class="card"><div class="stat"><strong>${fmt(fee)}</strong><span>Activation fee</span></div><div class="notice">Enter the M-Pesa number that should receive the STK Push prompt. Keep this page open while payment is verified.</div><div id="activationError" class="notice error hidden"></div><form id="activationForm"><div class="field"><label>M-Pesa phone number</label><input id="activationPhone" inputmode="tel" placeholder="0712345678" required></div><button class="btn full">Pay with M-Pesa</button></form><button class="btn secondary full" id="activationBack" style="margin-top:8px">Back to chat</button></section>`,'chat');$('#activationBack').onclick=()=>renderHome();$('#activationForm').onsubmit=async e=>{e.preventDefault();const phone=normalizePhone($('#activationPhone').value),btn=e.submitter,err=$('#activationError');if(!phone){err.textContent='Enter a valid M-Pesa number.';err.classList.remove('hidden');return}btn.disabled=true;err.classList.add('hidden');try{const d=await req('/functions/v1/activate',{method:'POST',body:{phone}});if(d.alreadyActivated){await loadProfile();toast('Your account is already activated.');renderHome();return}if(!d.pendingId)throw Error(d.message||d.error||'The server did not return a payment reference.');state.pendingId=d.pendingId;state.pendingKind='activation';renderWaiting(d.pendingId,'activation')}catch(ex){err.textContent=ex.message;err.classList.remove('hidden')}finally{btn.disabled=false}}}
function renderWaiting(id,kind){state.page='waiting';shell(`<section class="hero"><h1>Verifying payment</h1><p>Complete the M-Pesa prompt on your phone. This page will check the payment status.</p></section><section class="card"><div class="notice">Keep this page open. Verification runs every 5 seconds.</div><div id="waitingStatus" class="notice">Waiting for payment confirmationâ€¦</div><button class="btn secondary full" id="checkNow">Check status now</button><button class="btn ghost full" id="cancelWait" style="margin-top:8px">Return to chat</button></section>`,'chat');$('#cancelWait').onclick=()=>{clearTimeout(state.pollTimer);renderHome()};const check=async()=>{try{const path=kind==='activation'?'/functions/v1/check-activation?id=':'/functions/v1/check-signup?id=';const d=await req(path+encodeURIComponent(id),{token:KEY});const status=String(d.status||'').toUpperCase();if(status==='COMPLETED'){clearTimeout(state.pollTimer);$('#waitingStatus').className='notice success';$('#waitingStatus').textContent='Payment confirmed. Updating your accountâ€¦';await loadProfile();toast('Payment confirmed.');renderHome();return}if(status==='FAILED'){clearTimeout(state.pollTimer);$('#waitingStatus').className='notice error';$('#waitingStatus').textContent='Payment was not completed. Return to activation and try again.';return}$('#waitingStatus').textContent='Status: '+(status||'PENDING')+'. Waiting for confirmationâ€¦'}catch(ex){$('#waitingStatus').textContent=ex.message}state.pollTimer=setTimeout(check,5000)};$('#checkNow').onclick=()=>{clearTimeout(state.pollTimer);check()};check()}
async function boot(){if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});if(new URLSearchParams(location.search).get('ref')){state.ref=new URLSearchParams(location.search).get('ref').trim().toUpperCase();localStorage.setItem('cm_ref',state.ref)}if(state.token&&state.uid){try{await loadProfile();renderHome();return}catch{}}renderAuth()}
boot();

</script>
